---
name: ci

# Fast checks for the Hugo site: vendored design tokens, markdown style,
# spelling, and link health (the hugo.yml workflow owns build + deploy).
# Linkcheck runs source-only via the shared lychee reusable; the excludes
# below mirror the old built-HTML check (bot-walled hosts are excluded;
# absolute site links are skipped -- they 404 on live until merged and are
# self-consistent by construction). submap.fr excluded 2026-11-23:
# redirects to submap.gm.umontpellier.fr with expired cert (upstream,
# renewal date unknown). zenodo.org excluded 2026-11-24: returns 403 to
# CI runners while serving browsers fine.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  design-drift:
    uses: buchanankerswell/actions/.github/workflows/design-drift.yml@v1
    with:
      static-dir: assets/css/extended
      files: tokens.css
  markdownlint:
    uses: buchanankerswell/actions/.github/workflows/markdownlint.yml@v1
    with:
      globs: |
        content/**/*.md
        README.md
  typos:
    uses: buchanankerswell/actions/.github/workflows/typos.yml@v1
  linkcheck:
    uses: buchanankerswell/actions/.github/workflows/linkcheck.yml@v1
    with:
      args: "--verbose --no-progress --timeout 60 --root-dir static --exclude 'mailto:' --exclude 'buchanankerswell\\.com' --exclude 'scholar\\.google' --exclude 'researchgate\\.net' --exclude 'doi\\.org' --exclude 'nature\\.com' --exclude 'onlinelibrary\\.wiley\\.com' --exclude 'minpet\\.org' --exclude 'zenodo\\.org' --exclude 'submap' './content/**/*.md' './README.md'"
