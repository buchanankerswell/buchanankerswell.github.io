<!-- MathJax v3 (async). Loads on research/tag pages, or any page with `math: true`.
     Site default is `math: false`; `content/research/_index.md` enables it
     for that section via cascade. -->
{{- if or (eq .Section "research") (eq .Section "tags") (.Param "math") }}
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
    }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
{{- end }}
